services:
  app:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    volumes:
      - ..:/workspaces:cached
    working_dir: /workspaces/kikas-e-bonitas-api/KikasBonitas.Api
    command: bash -lc "dotnet restore && dotnet watch --project ./KikasBonitas.Api.csproj run --urls=http://0.0.0.0:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=appdb;User=root;Password=example;
    depends_on:
      - mysql
    ports:
      - "5000:5000"

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  mysql-data:
